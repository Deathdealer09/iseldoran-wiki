      <h1>The Iseldoran Sagas</h1>
      <p>The official master archive and interactive lore repository for The Iseldoran Sagas — an
      epic science-fantasy book series of empires, god-kings, dynastic wars, and cosmic theology
      spanning more than 35,000 years of imperial history. 38+ volumes, 1.74M+ words.</p>
      <p>The Iseldoran Sagas combine imperial science fiction, dynastic political drama, mythic space
      opera, and military realism, drawing on African, Arabian, Mongolian, and imperial European
      influences. Readers of Dune, Foundation, and Warhammer 40K will feel at home beneath the
      Dragon Throne.</p>
      <p>Major dynasties and factions include the Pierre von Care Dynasty, the Church of Iseldora,
      the Black Death, the Sardukar and Red Sardukar, the Vah'Sumir, the Ashari'i, and the Hapsburgi.
      Key figures include Kerron Pierre von Care the Dragon Emperor, Cassian I the first God-King,
      Niccolò Kerron von Hapsburgi "Thunderborn," Khutun Ghegha Khan, Lucius Luceron II the Soldier
      Emperor, and Asha Kers I "La Diosa."</p>
      <p>This site requires JavaScript to explore the full interactive compendium of novels,
      characters, sovereigns, and timelines.</p>
